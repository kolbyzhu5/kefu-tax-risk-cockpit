<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>可孚医疗集团税务风险驾驶舱 · 数据指挥舱</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg0:#05080f; --bg1:#0a1222; --bg2:#0d1830;
    --panel:rgba(14,25,46,.72); --panel-solid:#0d1830;
    --line:rgba(56,189,248,.16); --line-strong:rgba(56,189,248,.34);
    --text:#e6f1ff; --muted:#8aa4c8; --faint:#5c7191;
    --cyan:#22d3ee; --cyan2:#38bdf8; --cyan-glow:rgba(34,211,238,.55);
    --red:#fb4d5c; --red2:#f43f5e; --orange:#fb923c; --amber:#f5b93f;
    --green:#34d399; --purple:#a78bfa; --blue:#38bdf8;
    --num:"Rajdhani","DIN Alternate","Bahnschrift","Segoe UI",-apple-system,sans-serif;
    --cn:"PingFang SC","Microsoft YaHei",-apple-system,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{
    font-family:var(--cn); color:var(--text); font-size:14px; line-height:1.6;
    background:
      radial-gradient(1200px 700px at 12% -10%, rgba(34,211,238,.10), transparent 60%),
      radial-gradient(1000px 600px at 88% 0%, rgba(56,189,248,.08), transparent 55%),
      radial-gradient(900px 600px at 50% 120%, rgba(124,58,237,.08), transparent 60%),
      linear-gradient(180deg, var(--bg1), var(--bg0));
    background-attachment:fixed;
    overflow-x:hidden;
  }
  /* 网格 + 扫描背景层 */
  .bg-fx{position:fixed;inset:0;pointer-events:none;z-index:0}
  .bg-fx .grid{
    position:absolute;inset:0;
    background-image:linear-gradient(rgba(56,189,248,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(56,189,248,.05) 1px,transparent 1px);
    background-size:44px 44px;
    -webkit-mask-image:radial-gradient(ellipse at 50% 0%,#000 0%,transparent 78%);
    mask-image:radial-gradient(ellipse at 50% 0%,#000 0%,transparent 78%);
  }
  .bg-fx .scan{position:absolute;left:0;right:0;top:-220px;height:220px;
    background:linear-gradient(180deg,transparent,rgba(34,211,238,.07),transparent);
    animation:scan 9s linear infinite;}
  @keyframes scan{0%{transform:translateY(0)}100%{transform:translateY(110vh)}}

  .wrap{position:relative;z-index:1;max-width:1500px;margin:0 auto;padding:22px 28px 70px}

  /* ===== header ===== */
  header{display:flex;align-items:center;justify-content:space-between;padding:6px 4px 20px;border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:16px}
  .logo{position:relative;width:46px;height:46px;flex:none;
    display:flex;align-items:center;justify-content:center;
    font-size:20px;font-weight:700;color:#031018;
    background:linear-gradient(135deg,var(--cyan),var(--blue));
    clip-path:polygon(0 0,100% 0,100% 72%,72% 100%,0 100%);
    box-shadow:0 0 22px var(--cyan-glow);}
  .brand h1{font-size:22px;font-weight:600;letter-spacing:1px}
  .brand h1 em{font-style:normal;color:var(--cyan);text-shadow:0 0 16px var(--cyan-glow)}
  .brand .sub{font-size:12px;color:var(--muted);letter-spacing:.5px;margin-top:2px}
  .head-right{display:flex;align-items:center;gap:14px}
  .clock{font-family:var(--num);font-size:15px;color:var(--cyan);letter-spacing:1px;
    display:flex;align-items:center;gap:8px}
  .live{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--green)}
  .live i{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);animation:blink 1.4s ease infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
  .badge{padding:4px 12px;border-radius:4px;font-size:12px;letter-spacing:.5px;
    border:1px solid var(--line);color:var(--muted);background:rgba(14,25,46,.6)}
  .badge.sim{color:var(--amber);border-color:rgba(245,185,63,.35);background:rgba(245,185,63,.08)}

  /* ===== tabs ===== */
  .tabs{display:flex;gap:6px;margin:20px 0 22px;padding:5px;border:1px solid var(--line);border-radius:8px;background:rgba(10,18,34,.6)}
  .tab{flex:1;text-align:center;padding:11px 6px;border-radius:6px;cursor:pointer;font-size:13.5px;color:var(--muted);transition:.18s;border:1px solid transparent;background:transparent;position:relative;font-family:var(--cn)}
  .tab .n{font-family:var(--num);font-size:11px;opacity:.6;margin-right:4px;letter-spacing:.5px}
  .tab:hover{color:var(--text);background:rgba(56,189,248,.06)}
  .tab.active{color:#031018;background:linear-gradient(135deg,var(--cyan),var(--blue));font-weight:600;box-shadow:0 0 18px var(--cyan-glow)}
  .tab.active .n{opacity:.9}

  /* ===== 卡片 ===== */
  .card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 20px;
    backdrop-filter:blur(6px);animation:fadeUp .6s ease both}
  .card::before,.card::after,.card .c4::before,.card .c4::after{content:"";position:absolute;width:10px;height:10px;border-color:var(--cyan);border-style:solid;opacity:.8}
  .card::before{top:-1px;left:-1px;border-width:2px 0 0 2px}
  .card::after{top:-1px;right:-1px;border-width:2px 2px 0 0}
  .card .c4{position:absolute;inset:0;pointer-events:none}
  .card .c4::before{bottom:-1px;left:-1px;border-width:0 0 2px 2px}
  .card .c4::after{bottom:-1px;right:-1px;border-width:0 2px 2px 0}
  .card h3{font-size:13px;font-weight:600;color:var(--muted);margin-bottom:14px;letter-spacing:1px;display:flex;align-items:center;gap:8px}
  .card h3::before{content:"";width:3px;height:14px;background:var(--cyan);box-shadow:0 0 8px var(--cyan-glow)}
  @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

  .grid{display:grid;gap:18px}
  .g3{grid-template-columns:repeat(3,1fr)}
  .muted{color:var(--muted)} .faint{color:var(--faint)}

  /* ===== KPI strip ===== */
  .kpi-strip{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;margin-bottom:18px}
  .kpi{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;overflow:hidden;animation:fadeUp .6s ease both}
  .kpi::after{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--kc,var(--cyan));box-shadow:0 0 10px var(--kc,var(--cyan))}
  .kpi .k-label{font-size:12px;color:var(--muted);letter-spacing:.5px}
  .kpi .k-num{font-family:var(--num);font-size:34px;font-weight:700;line-height:1.1;margin-top:6px;
    color:var(--kc,var(--cyan));text-shadow:0 0 18px var(--kg,var(--cyan-glow));font-variant-numeric:tabular-nums}
  .kpi .k-num small{font-size:15px;font-weight:600;opacity:.7;margin-left:2px}
  .kpi .k-sub{font-size:11px;color:var(--faint);margin-top:4px}

  /* ===== 仪表盘 ===== */
  .gauge-wrap{display:flex;align-items:center;gap:24px}
  .gauge{position:relative;width:168px;height:168px;flex:none}
  .gauge svg{width:100%;height:100%;transform:rotate(-90deg)}
  .gauge .track{stroke:rgba(56,189,248,.1)}
  .gauge .prog{stroke-linecap:round;transition:stroke-dashoffset 1.4s cubic-bezier(.22,1,.36,1);filter:drop-shadow(0 0 8px var(--cyan-glow))}
  .gauge .val{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .gauge .val b{font-family:var(--num);font-size:44px;font-weight:700;line-height:1;text-shadow:0 0 20px var(--cyan-glow)}
  .gauge .val span{font-size:11px;color:var(--muted);margin-top:4px;letter-spacing:1px}
  .gauge-side .pill-lg{font-size:13px;padding:4px 14px;border-radius:20px;font-weight:600;display:inline-block}
  .gauge-side .delta{margin-top:12px;font-size:12px;color:var(--muted)}

  /* ===== 分布条 ===== */
  .dist{display:flex;flex-direction:column;gap:14px}
  .dist .row{display:flex;align-items:center;gap:12px}
  .dist .dot{width:11px;height:11px;border-radius:3px;flex:none;box-shadow:0 0 8px currentColor}
  .dist .lab{width:22px;flex:none;font-size:13px;font-weight:600}
  .dist .bar{flex:1;height:26px;border-radius:5px;overflow:hidden;background:rgba(56,189,248,.06);border:1px solid var(--line);position:relative}
  .dist .seg{display:flex;align-items:center;justify-content:flex-end;padding-right:8px;height:100%;color:#031018;font-size:12px;font-weight:700;font-family:var(--num);cursor:pointer;transition:width .8s cubic-bezier(.22,1,.36,1),filter .15s}
  .dist .seg:hover{filter:brightness(1.15)}
  .legend{margin-top:6px;font-size:12px;color:var(--muted);display:flex;gap:18px}

  /* ===== 排名 ===== */
  .rank{display:flex;flex-direction:column;gap:12px}
  .rank .item{cursor:pointer;padding:4px 0}
  .rank .row{display:flex;align-items:center;gap:10px;font-size:12px}
  .rank .name{width:80px;flex:none;font-weight:500;color:var(--text)}
  .rank .idx{width:18px;flex:none;font-family:var(--num);color:var(--faint);font-weight:700}
  .rank .track{flex:1;height:16px;background:rgba(56,189,248,.06);border-radius:3px;overflow:hidden}
  .rank .fill{height:100%;border-radius:3px;transition:width .9s cubic-bezier(.22,1,.36,1);box-shadow:0 0 10px currentColor}
  .rank .score{width:44px;text-align:right;font-weight:700;font-family:var(--num);font-size:13px}
  .rank .tag{width:32px;flex:none;text-align:center;font-size:11px;border-radius:4px;padding:2px 0;font-weight:600}

  /* ===== pill ===== */
  .pill{display:inline-block;padding:2px 10px;border-radius:12px;font-size:12px;font-weight:500}
  .lv-high{background:rgba(244,63,94,.15);color:#ff7a88;border:1px solid rgba(244,63,94,.3)}
  .lv-mid{background:rgba(251,146,60,.15);color:#ffb37a;border:1px solid rgba(251,146,60,.3)}
  .lv-low{background:rgba(52,211,153,.14);color:#6ee7b7;border:1px solid rgba(52,211,153,.3)}
  .st-pending{background:rgba(251,146,60,.15);color:#ffb37a;border:1px solid rgba(251,146,60,.3)}
  .st-fixing{background:rgba(56,189,248,.15);color:#7dd3fc;border:1px solid rgba(56,189,248,.3)}
  .st-closed{background:rgba(52,211,153,.14);color:#6ee7b7;border:1px solid rgba(52,211,153,.3)}

  /* ===== 分类卡片 ===== */
  .cat-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:18px}
  .cat-card{position:relative;border-radius:10px;padding:16px 16px 14px;cursor:pointer;border:1px solid var(--line);background:var(--panel);transition:.18s;overflow:hidden}
  .cat-card::after{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--cc,var(--cyan));box-shadow:0 0 12px var(--cc,var(--cyan))}
  .cat-card:hover{transform:translateY(-3px);border-color:var(--cc,var(--cyan));box-shadow:0 8px 24px rgba(0,0,0,.4)}
  .cat-card.active{border-color:var(--cc,var(--cyan));box-shadow:0 0 0 1px var(--cc,var(--cyan)),0 0 24px var(--cc,var(--cyan))}
  .cat-card .cat-name{font-size:13px;font-weight:600;margin-bottom:8px}
  .cat-card .cat-score{font-family:var(--num);font-size:32px;font-weight:700;line-height:1;text-shadow:0 0 16px var(--cc,var(--cyan))}
  .cat-card .cat-meta{font-size:11px;color:var(--muted);margin-top:8px}

  /* ===== 疑点列表 ===== */
  .issue{display:flex;align-items:center;gap:14px;padding:13px 16px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;cursor:pointer;background:rgba(14,25,46,.5);transition:.18s;position:relative}
  .issue:hover{border-color:var(--cyan);box-shadow:0 0 0 1px rgba(34,211,238,.3),0 0 18px rgba(34,211,238,.12);transform:translateX(3px)}
  .issue .lv{width:40px;flex:none;text-align:center;font-size:12px;font-weight:700;border-radius:5px;padding:3px 0}
  .issue .main{flex:1;min-width:0}
  .issue .desc{font-weight:500;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .issue .meta{font-size:12px;color:var(--muted);margin-top:3px}
  .issue .amt{font-family:var(--num);font-weight:700;font-size:15px;flex:none;text-align:right;color:var(--amber)}
  .issue .amt small{display:block;font-family:var(--cn);font-weight:400;font-size:11px;color:var(--muted)}
  .issue .st{flex:none}

  /* ===== 处置泳道 ===== */
  .lanes{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .lane{border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--panel)}
  .lane .lane-head{display:flex;align-items:center;justify-content:space-between;padding:4px 6px 12px;border-bottom:1px solid var(--line);margin-bottom:12px}
  .lane .lane-head b{font-size:14px;display:flex;align-items:center;gap:8px}
  .lane .lane-head b::before{content:"";width:8px;height:8px;border-radius:2px;background:currentColor;box-shadow:0 0 8px currentColor}
  .lane .lane-head .cnt{font-family:var(--num);font-size:24px;font-weight:700;line-height:1}
  .lane .issue{background:rgba(10,18,34,.5);box-shadow:none}

  /* ===== 指标 ===== */
  .metric-toolbar{display:flex;align-items:center;gap:12px;margin-bottom:16px}
  .metric-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
  .metric-card .head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px}
  .metric-card .head b{font-size:14px}
  .metric-card .head .cur{font-family:var(--num);font-size:22px;font-weight:700;text-shadow:0 0 14px currentColor}
  .metric-card svg{width:100%;height:158px}
  .grid-line{stroke:rgba(56,189,248,.08)}

  select,input{background:var(--panel-solid);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:7px 12px;font-size:13px;font-family:var(--cn);outline:none}
  select:focus,input:focus{border-color:var(--cyan);box-shadow:0 0 0 2px rgba(34,211,238,.15)}
  .btn{padding:7px 16px;border-radius:6px;border:1px solid var(--line);background:rgba(14,25,46,.6);font-size:13px;cursor:pointer;color:var(--text);font-family:var(--cn);transition:.15s}
  .btn:hover{border-color:var(--cyan);color:var(--cyan)}
  .btn.primary{background:linear-gradient(135deg,var(--cyan),var(--blue));color:#031018;border-color:transparent;font-weight:600}

  .filter-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}

  /* ===== 表格 ===== */
  table.ev{width:100%;border-collapse:collapse;font-size:13px}
  table.ev th{background:rgba(34,211,238,.06);text-align:left;padding:10px 12px;color:var(--cyan);font-weight:600;letter-spacing:.5px;border-bottom:1px solid var(--line-strong);font-size:12px}
  table.ev td{padding:10px 12px;border-bottom:1px solid var(--line);color:var(--text)}
  table.ev tr:hover td{background:rgba(34,211,238,.04)}
  table.ev tr:last-child td{border-bottom:none}
  .num-cell{font-family:var(--num);font-weight:600;font-variant-numeric:tabular-nums}

  /* ===== modal ===== */
  .mask{position:fixed;inset:0;background:rgba(3,6,12,.72);display:none;align-items:center;justify-content:center;z-index:100;padding:20px;backdrop-filter:blur(4px)}
  .mask.show{display:flex}
  .modal{background:linear-gradient(180deg,var(--bg2),var(--bg1));border:1px solid var(--line-strong);border-radius:14px;width:800px;max-width:100%;max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.6),0 0 40px rgba(34,211,238,.1)}
  .modal .m-head{padding:20px 24px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;justify-content:space-between;gap:14px;position:sticky;top:0;background:linear-gradient(180deg,var(--bg2),rgba(13,24,48,.95));z-index:2}
  .modal .m-title{font-size:16px;font-weight:600;color:var(--text)}
  .modal .m-meta{font-size:12px;color:var(--muted);margin-top:7px}
  .modal .m-meta b{color:var(--amber);font-family:var(--num);font-weight:700}
  .modal .close{border:none;background:transparent;font-size:26px;cursor:pointer;color:var(--muted);line-height:1;transition:.15s}
  .modal .close:hover{color:var(--red)}
  .modal .m-body{padding:18px 24px 22px}
  .ev-tabs{display:flex;gap:8px;margin-bottom:16px;border-bottom:1px solid var(--line);padding-bottom:0}
  .ev-tab{padding:9px 16px;font-size:13px;cursor:pointer;border:none;background:transparent;color:var(--muted);border-bottom:2px solid transparent;font-family:var(--cn);transition:.15s}
  .ev-tab:hover{color:var(--text)}
  .ev-tab.active{color:var(--cyan);border-color:var(--cyan);font-weight:600}
  .flow-note{margin-top:14px;padding:12px 14px;border-radius:8px;background:rgba(34,211,238,.08);font-size:12px;color:var(--cyan);border:1px solid rgba(34,211,238,.18)}

  .view{display:none}
  .view.active{display:block}
  .empty{padding:40px;text-align:center;color:var(--faint)}

  @media(max-width:1000px){
    .kpi-strip{grid-template-columns:repeat(2,1fr)}
    .g3,.cat-grid,.lanes,.metric-grid{grid-template-columns:1fr}
  }

  /* ===== 评分模型 ===== */
  .model-flow{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
  .mf-step{position:relative;border:1px solid var(--line);border-radius:10px;padding:14px 16px;background:var(--panel)}
  .mf-l{font-family:var(--num);font-size:11px;color:var(--cyan);letter-spacing:1px;margin-bottom:6px}
  .mf-t{font-size:13.5px;font-weight:600;margin-bottom:8px}
  .mf-d{font-size:11.5px;color:var(--muted);line-height:1.7;min-height:34px}
  .formula{margin-top:10px;padding:10px 12px;border-radius:8px;background:rgba(34,211,238,.06);border:1px solid rgba(34,211,238,.16);font-family:var(--num);font-size:12px;color:var(--cyan);letter-spacing:.3px;line-height:1.6}
  .fx-item{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);align-items:flex-start}
  .fx-item:last-child{border-bottom:none}
  .fx-badge{flex:none;font-family:var(--num);font-size:12px;font-weight:700;padding:3px 10px;border-radius:5px;white-space:nowrap}

  /* ===== 路线图 ===== */
  .timeline{position:relative;padding-left:26px}
  .timeline::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:linear-gradient(180deg,var(--cyan),var(--purple));opacity:.4}
  .tl-item{position:relative;margin-bottom:18px}
  .tl-item:last-child{margin-bottom:0}
  .tl-item::before{content:"";position:absolute;left:-22px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--cyan);box-shadow:0 0 10px var(--cyan-glow)}
  .tl-head{display:flex;align-items:center;gap:12px;margin-bottom:8px;flex-wrap:wrap}
  .tl-phase{font-family:var(--num);font-weight:700;font-size:15px;color:var(--cyan);text-shadow:0 0 12px var(--cyan-glow)}
  .tl-name{font-size:15px;font-weight:600}
  .tl-week{font-size:12px;color:var(--amber);border:1px solid rgba(245,185,63,.3);border-radius:20px;padding:2px 10px;background:rgba(245,185,63,.08)}
  .tl-desc{font-size:12.5px;color:var(--muted);line-height:1.7}
  .tl-out{font-size:12px;color:var(--faint);margin-top:4px}
  .tl-out b{color:var(--text);font-weight:600}

  /* ===== 下钻：三流一致核验 ===== */
  .ev-map{margin-bottom:14px;padding:12px 14px;border-radius:8px;background:rgba(56,189,248,.05);border:1px solid var(--line)}
  .em-row{font-size:12.5px;line-height:1.9}
  .em-row b{color:var(--cyan)}
  .link-keys{margin-bottom:16px;font-size:12px;color:var(--faint);line-height:1.9}
  .link-keys code{font-family:var(--num);color:var(--cyan);background:rgba(34,211,238,.08);padding:2px 6px;border-radius:4px;margin:0 2px;font-size:11px}
  .verify-title{font-size:13px;color:var(--muted);margin:16px 0 10px;letter-spacing:1px;display:flex;align-items:center;gap:8px}
  .verify-title::before{content:"";width:3px;height:13px;background:var(--cyan);box-shadow:0 0 8px var(--cyan-glow)}
  .verify{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .v-item{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:rgba(10,18,34,.5)}
  .v-name{font-size:12px;color:var(--muted);margin-bottom:4px}
  .v-result{font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
  .v-dot{width:8px;height:8px;border-radius:50%;flex:none}
  @media(max-width:1000px){.model-flow{grid-template-columns:1fr}.verify{grid-template-columns:1fr}}

/* ============ 计算 ============ */
function subScore(sid){
  const s = SUB_SCORES[sid]; let t=0;
  CAT_ORDER.forEach(k=>{ t += s[k] * CATS[k].weight/100; });
  return t;
}
function subLevel(score){ return score>60?'high':(score>30?'mid':'low'); }
function groupScore(){
  const revTotal = SUBS.reduce((a,s)=>a+s.rev,0);
  let t=0; SUBS.forEach(s=>{ t += subScore(s.id)*s.rev/revTotal; });
  return t;
}
function fmtW(n){ return n>=10000 ? (n/10000).toFixed(2).replace(/\.?0+$/,'')+' 亿' : n.toLocaleString('zh-CN')+' 万'; }

/* ============ 通用动画 ============ */
function countUp(el, target, opts){
  opts = opts||{};
  const dur = opts.dur||1100, decimals = opts.decimals||0;
  const suffix = opts.suffix||'', prefix = opts.prefix||'';
  const start = performance.now();
  function step(now){
    const p = Math.min(1,(now-start)/dur);
    const e = 1-Math.pow(1-p,3);
    const v = target*e;
    el.textContent = prefix + (decimals? v.toFixed(decimals) : Math.round(v).toLocaleString('zh-CN')) + suffix;
    if(p<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

/* ============ 指标监控 ============ */
function genSeries(base, vol, drift, seed){
  const arr=[]; let v=base;
  for(let i=0;i<12;i++){
    const noise=(Math.sin(i*1.7+seed)*0.5+Math.cos(i*0.9+seed*2)*0.5)*vol;
    v = base + drift*(i-6) + noise;
    arr.push(+v.toFixed(2));
  }
  return arr;
}
const METRICS = [
  {key:'tax', name:'增值税税负率', unit:'%', color:'#22d3ee'},
  {key:'gm', name:'毛利率', unit:'%', color:'#34d399'},
  {key:'cost', name:'费用率', unit:'%', color:'#a78bfa'},
  {key:'gap', name:'收入勾稽差异', unit:'%', color:'#fb4d5c'},
];
function metricBase(key){
  if(key==='tax') return SUBS.reduce((a,s)=>a+s.tax*s.rev,0)/SUBS.reduce((a,s)=>a+s.rev,0);
  if(key==='gm') return SUBS.reduce((a,s)=>a+s.gm*s.rev,0)/SUBS.reduce((a,s)=>a+s.rev,0);
  if(key==='cost') return SUBS.reduce((a,s)=>a+s.cost*s.rev,0)/SUBS.reduce((a,s)=>a+s.rev,0);
  if(key==='gap') return SUBS.reduce((a,s)=>a+s.gap*s.rev,0)/SUBS.reduce((a,s)=>a+s.rev,0);
}
function metricSeries(key, sid){
  if(sid==='group') return genSeries(metricBase(key), key==='gap'?1.0:0.6, key==='gap'?0.06:0.02, {tax:1,gm:2,cost:3,gap:4}[key]);
  const s = SUBS.find(x=>x.id===sid);
  const v = {tax:s.tax, gm:s.gm, cost:s.cost, gap:s.gap}[key];
  return genSeries(v, key==='gap'?1.2:0.8, key==='gap'?0.08:0.03, {tax:1,gm:2,cost:3,gap:4}[key]);
}
function drawLine(data, color, warn){
  const w=520, h=158, pad=30;
  const max=Math.max(...data)*1.15, min=Math.min(...data)*0.85;
  const range=(max-min)||1;
  const gid = 'g'+Math.random().toString(36).slice(2,7);
  const pts = data.map((v,i)=>[pad+i*(w-pad*2)/(data.length-1), h-pad-(v-min)/range*(h-pad*2)]);
  const line = pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area = line+` L ${pts[pts.length-1][0]} ${h-pad} L ${pts[0][0]} ${h-pad} Z`;
  const dots = pts.map((p,i)=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3" fill="#0a1222" stroke="${color}" stroke-width="2"><title>${data[i]}%</title></circle>`).join('');
  let warnLine='';

function genEvidence(i){
  const cp = i.cp, amt = i.amt;
  const rate = SUBS.find(s=>s.id===i.sub).vat;
  const no = (n,p)=>String(n).padStart(p||8,'0');
  return {
    voucher:{col:['凭证号','日期','科目','摘要','金额'], rows:[
      ['记-2026-'+no(i.id*3+1,4), i.date, '库存商品 / 主营业务成本', i.desc, fmtW(amt)],
      ['记-2026-'+no(i.id*3+2,4), i.date, '应交税费—应交增值税（进项）', '对应发票入账', fmtW(Math.round(amt*0.13))],
    ]},
    invoice:{col:['发票号码','开票方','金额','税率','用途确认'], rows:[
      ['044002'+no(i.id,6), cp, fmtW(amt), rate, i.status==='closed'?'已确认':'待确认'],
    ]},
    contract:{col:['合同编号','签约方','合同金额','签订日期','状态'], rows:[
      ['HT-2026-'+no(i.id,4), cp, fmtW(amt), i.date, '履约中'],
    ]},
    flow:{col:['银行流水号','对手方','金额','交易日期','方向'], rows:[
      ['LS'+no(i.id*7,8), cp, fmtW(amt), i.date, '支出'],
      ['LS'+no(i.id*7+1,8), cp, fmtW(Math.round(amt*0.3)), i.date, '支出'],
    ]},
  };
}
const EV_MAP = {
  invoice:{must:'发票 + 原始凭证', aux:'资金流水', point:'进项抵扣合规性 · 三流一致 · 用途确认'},
  income:{must:'原始凭证 + 合同', aux:'发票', point:'收入确认时点 · 成本结转匹配 · 隐匿收入排查'},
  prefer:{must:'原始凭证 + 合同', aux:'发票', point:'优惠条件真实性 · 研发辅助账 · 资质口径'},
  related:{must:'合同 + 资金流水', aux:'原始凭证', point:'转让定价公允性 · 资金往来计息 · 独立交易原则'},
  payroll:{must:'原始凭证 + 资金流水', aux:'合同', point:'全员申报 · 社保基数一致 · 计税方式正确'},
};
function genVerify(i){
  const rules = [
    {name:'合同 vs 发票', hint:'差异阈值 >5%'},
    {name:'发票 vs 资金流水', hint:'差异阈值 >10%'},
    {name:'凭证 vs 发票', hint:'入账一致性'},
    {name:'申报 vs 财报', hint:'口径差异 >5%'},
  ];
  const bad = {invoice:0, income:1, prefer:3, related:1, payroll:2}[i.cat];
  return rules.map((r,idx)=>{
    if(i.status==='closed') return {name:r.name, hint:r.hint, status:'ok', text:'核验通过'};
    if(idx===bad) return {name:r.name, hint:r.hint, status:'abnormal', text:'差异 '+(5.5+idx*1.3).toFixed(1)+'% · 超出阈值'};
    if(i.level==='high') return {name:r.name, hint:r.hint, status:'abnormal', text:'差异 '+(5.5+idx*1.3).toFixed(1)+'% · 待复核'};
    return {name:r.name, hint:r.hint, status:'warn', text:'待核验'};
  });
}

          <div class="row"><span class="lab" style="width:110px">风险识别覆盖率</span><div class="bar"><div class="seg" style="width:0%;background:var(--green)" data-w="90">≥90%</div></div></div>
          <div class="row"><span class="lab" style="width:110px">高危核实及时率</span><div class="bar"><div class="seg" style="width:0%;background:var(--cyan)" data-w="95">≥95%</div></div></div>
          <div class="row"><span class="lab" style="width:110px">销号闭环率</span><div class="bar"><div class="seg" style="width:0%;background:var(--purple)" data-w="90">≥90%</div></div></div>
        </div>
      </div>
      <div class="card">
        <span class="c4"></span>
        <h3>组织分工</h3>
        <div class="fx-item"><span class="fx-badge" style="background:rgba(34,211,238,.12);color:var(--cyan)">税务/财务</span><div class="muted" style="font-size:12.5px">疑点核实、整改、销号复核、权重与阈值口径</div></div>
        <div class="fx-item"><span class="fx-badge" style="background:rgba(56,189,248,.12);color:#7dd3fc">IT/数据</span><div class="muted" style="font-size:12.5px">数据集成、主数据治理、血缘链路、看板实现</div></div>
        <div class="fx-item"><span class="fx-badge" style="background:rgba(167,139,250,.12);color:#c4b5fd">BI</span><div class="muted" style="font-size:12.5px">指标建模、可视化、下钻交互、看板运维</div></div>
        <div class="fx-item"><span class="fx-badge" style="background:rgba(245,185,63,.12);color:var(--amber)">管理层</span><div class="muted" style="font-size:12.5px">预算审批、跨部门协调、重大风险决策</div></div>
      </div>
      <div class="card">
        <span class="c4"></span>
        <h3>关键风险与应对</h3>
        <div class="fx-item"><span class="fx-badge" style="background:rgba(244,63,94,.15);color:#ff7a88">主数据断链</span><div class="muted" style="font-size:12.5px">六类关联键缺失 → P0 先做主数据治理</div></div>
        <div class="fx-item"><span class="fx-badge" style="background:rgba(244,63,94,.15);color:#ff7a88">数据质量</span><div class="muted" style="font-size:12.5px">源系统口径不一致 → 统一指标字典 + 校验规则</div></div>
        <div class="fx-item"><span class="fx-badge" style="background:rgba(244,63,94,.15);color:#ff7a88">权重主观</span><div class="muted" style="font-size:12.5px">依赖专家经验 → AHP + 回测校准</div></div>
        <div class="fx-item"><span class="fx-badge" style="background:rgba(244,63,94,.15);color:#ff7a88">权责不清</span><div class="muted" style="font-size:12.5px">整改无人跟进 → 责任人派单 + SLA 预警</div></div>
      </div>
    </div>`;

  setTimeout(()=>{
    el.querySelectorAll('.seg').forEach(s=>{ s.style.width = s.dataset.w+'%'; });
  },120);
}

/* ============ Tab 切换 ============ */
function switchTab(v){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.v===v));
  document.querySelectorAll('.view').forEach(vv=>vv.classList.remove('active'));
  const view = document.getElementById('view-'+v);
  view.classList.add('active');
  /* 重新触发入场动画 */
  view.querySelectorAll('.card,.kpi,.cat-card,.issue,.lane').forEach((n,i)=>{ n.style.animation='none'; void n.offsetWidth; n.style.animation=''; });
  /* 重播分布/进度条动画 */
  view.querySelectorAll('.seg,.rank .fill').forEach(s=>{ const w=s.dataset.w; if(w){ s.style.width='0%'; requestAnimationFrame(()=>requestAnimationFrame(()=>{ s.style.width=w+'%'; })); } });
}

/* ============ 时钟 ============ */
function tickClock(){
  const d=new Date();
  const p=n=>String(n).padStart(2,'0');
  document.getElementById('clock').textContent = `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}
setInterval(tickClock,1000); tickClock();

document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click', ()=> switchTab(t.dataset.v));
});

/* ============ 初始化 ============ */
renderOverview();
renderCategory();
renderProgress();
renderMetric();
renderIssues();
renderModel();
renderRoadmap();
</script>
</body>
